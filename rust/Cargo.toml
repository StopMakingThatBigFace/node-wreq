[package]
name = "node-wreq"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# HTTP client with browser impersonation
wreq = { version = "6.0.0-rc.29", default-features = false, features = ["tokio-rt", "gzip", "brotli", "deflate", "zstd", "socks", "cookies", "json", "charset", "multipart", "stream", "hickory-dns", "system-proxy", "webpki-roots", "ws"] }
wreq-util = { version = "3.0.0-rc.14", features = ["emulation-serde"] }
http-body-util = "0.1"

# Neon for Node.js bindings
neon = { version = "1.0", default-features = false, features = ["napi-6"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime (if needed)
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
webpki-root-certs = "1.0.3"
hickory-resolver = { version = "0.25.2", features = ["system-config", "https-ring", "webpki-roots"] }
url = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
