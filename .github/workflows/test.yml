name: 🧪 Test

on:
  push:
    paths:
      - '.github/workflows/test.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'rust-toolchain.toml'
      - 'tsconfig.json'
      - 'src/**'
      - 'rust/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'rust-toolchain.toml'
      - 'tsconfig.json'
      - 'src/**'
      - 'rust/**'
      - 'scripts/**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]

    name: Test on Node ${{ matrix.node-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: test-${{ matrix.os }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Rust linting components
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: lint

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run oxlint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Check Rust formatting
        run: npm run format:rust:check

      - name: Run clippy
        run: npm run lint:rust
